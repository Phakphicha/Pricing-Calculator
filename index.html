<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เครื่องมือคำนวณราคาขาย Multi-Platform | Shopee · TikTok · Lazada</title>
  <meta name="description" content="คำนวณราคาขาย กำไร และค่าธรรมเนียมของ Shopee, TikTok Shop, Lazada และแพลตฟอร์มอื่นแบบเทียบข้างกัน" />

  <!-- Fonts (Kanit) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { kanit: ['Kanit', 'sans-serif'] },
        }
      }
    }
  </script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <!-- Alpine.js -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>

<body class="font-kanit bg-slate-100 text-slate-800 min-h-screen" x-data="pricingApp()" x-init="init()">

  <!-- ═══════════════ HEADER ═══════════════ -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur border-b border-slate-200 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center gap-3">
      <!-- Logo -->
      <div class="flex items-center gap-2.5 mr-auto">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-orange-500 via-pink-500 to-indigo-600 flex items-center justify-center text-white shrink-0">
          <i data-lucide="calculator" class="w-5 h-5"></i>
        </div>
        <div class="leading-tight">
          <h1 class="font-semibold text-slate-900 text-sm sm:text-base">เครื่องมือคำนวณราคาขาย Multi-Platform</h1>
          <p class="text-[11px] sm:text-xs text-slate-500">Shopee · TikTok Shop · Lazada · ช่องทางอื่น</p>
        </div>
      </div>

      <!-- Fee update badge -->
      <span class="inline-flex items-center gap-1.5 text-xs bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-1 rounded-full">
        <i data-lucide="badge-check" class="w-3.5 h-3.5"></i>
        อัปเดตค่าธรรมเนียมล่าสุด 2026
      </span>

      <!-- Mode toggle -->
      <div class="flex bg-slate-100 rounded-lg p-1 text-sm">
        <button @click="mode='single'"
                :class="mode==='single' ? 'bg-white shadow text-slate-900' : 'text-slate-500'"
                class="px-3 py-1.5 rounded-md flex items-center gap-1.5 transition">
          <i data-lucide="box" class="w-4 h-4"></i> สินค้าชิ้นเดียว
        </button>
        <button @click="mode='bulk'"
                :class="mode==='bulk' ? 'bg-white shadow text-slate-900' : 'text-slate-500'"
                class="px-3 py-1.5 rounded-md flex items-center gap-1.5 transition">
          <i data-lucide="table-2" class="w-4 h-4"></i> หลายสินค้า (Bulk)
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-6">

    <!-- ═══════════════ SINGLE MODE ═══════════════ -->
    <template x-if="mode==='single'">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

      <!-- ── LEFT: INPUT PANEL ── -->
      <section class="lg:col-span-4 space-y-4">

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
          <h2 class="font-semibold text-slate-900 mb-4 flex items-center gap-2">
            <i data-lucide="settings-2" class="w-4.5 h-4.5 text-slate-400"></i> ข้อมูลสินค้าและต้นทุน
          </h2>

          <!-- SKU name -->
          <label class="block text-sm text-slate-600 mb-1">ชื่อสินค้า / SKU</label>
          <input type="text" x-model="form.sku" placeholder="เช่น เสื้อยืดคอกลม สีดำ"
                 class="input-field mb-4" />

          <!-- Costs -->
          <div class="grid grid-cols-2 gap-3 mb-4">
            <div>
              <label class="block text-sm text-slate-600 mb-1">ต้นทุนสินค้า (บาท)</label>
              <div class="relative">
                <input type="number" min="0" step="0.01" x-model.number="form.cost" class="input-field pr-8" />
                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm pointer-events-none">฿</span>
              </div>
            </div>
            <div>
              <label class="block text-sm text-slate-600 mb-1">กล่อง/บรรจุภัณฑ์ (บาท)</label>
              <div class="relative">
                <input type="number" min="0" step="0.01" x-model.number="form.packaging" class="input-field pr-8" />
                <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm pointer-events-none">฿</span>
              </div>
            </div>
          </div>

          <!-- Calc-mode toggle -->
          <div class="flex bg-slate-100 rounded-lg p-1 text-sm mb-4">
            <button @click="form.calcMode='target'"
                    :class="form.calcMode==='target' ? 'bg-white shadow text-emerald-700' : 'text-slate-500'"
                    class="flex-1 px-3 py-1.5 rounded-md transition">
              🎯 ตั้งกำไร → หาราคาขาย
            </button>
            <button @click="form.calcMode==='evaluate'"
                    :class="form.calcMode==='evaluate' ? 'bg-white shadow text-indigo-700' : 'text-slate-500'"
                    class="flex-1 px-3 py-1.5 rounded-md transition">
              📊 ใส่ราคา → ดูกำไร
            </button>
          </div>

          <!-- Target profit OR price -->
          <div x-show="form.calcMode==='target'">
            <label class="block text-sm text-slate-600 mb-1">กำไรที่ต้องการ (บาท/ชิ้น)</label>
            <div class="relative">
              <input type="number" min="0" step="0.01" x-model.number="form.targetProfit" class="input-field pr-8" />
              <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm pointer-events-none">฿</span>
            </div>
          </div>
          <div x-show="form.calcMode==='evaluate'" x-cloak>
            <label class="block text-sm text-slate-600 mb-1">ราคาขายปัจจุบัน (บาท)</label>
            <div class="relative">
              <input type="number" min="0" step="0.01" x-model.number="form.sellPrice" class="input-field pr-8" />
              <span class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm pointer-events-none">฿</span>
            </div>
          </div>

          <!-- Ads & voucher buffer -->
          <div class="grid grid-cols-2 gap-3 mt-4">
            <div>
              <label class="block text-sm text-slate-600 mb-1" title="งบโฆษณาที่ตั้งไว้ต่อการขาย 1 ชิ้น (เป็น % ของราคาขาย)">💡 งบโฆษณา (%)</label>
              <input type="number" min="0" max="100" step="0.5" x-model.number="form.adsPct" class="input-field" />
            </div>
            <div>
              <label class="block text-sm text-slate-600 mb-1" title="ส่วนลด/วอลเชอร์ที่ต้องแบกเอง (%)">🎟️ วอลเชอร์ (%)</label>
              <input type="number" min="0" max="100" step="0.5" x-model.number="form.voucherPct" class="input-field" />
            </div>
          </div>
        </div>

        <!-- Category preset -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
          <h3 class="font-semibold text-slate-900 mb-3 flex items-center gap-2">
            <i data-lucide="layers" class="w-4 h-4 text-slate-400"></i> หมวดหมู่สินค้า (Preset)
          </h3>
          <select x-model="form.category" @change="applyCategoryPreset()" class="input-field mb-3">
            <option value="fashion">👕 แฟชั่น (Fashion)</option>
            <option value="electronics">📱 อิเล็กทรอนิกส์ (Electronics)</option>
            <option value="health">💄 สุขภาพและความงาม (Health & Beauty)</option>
            <option value="fmcg">🧻 สินค้าอุปโภคบริโภค (FMCG)</option>
            <option value="other">📦 อื่น ๆ (กำหนดเอง)</option>
          </select>
          <p class="text-xs text-slate-500">เลือกหมวดหมู่เพื่อโหลดอัตราค่าคอมมิชชันมาตรฐานของแต่ละแพลตฟอร์มโดยอัตโนมัติ</p>
        </div>

        <!-- Platform toggles -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 space-y-3">
          <h3 class="font-semibold text-slate-900 flex items-center gap-2">
            <i data-lucide="toggle-right" class="w-4 h-4 text-slate-400"></i> แคมเปญแพลตฟอร์ม
          </h3>
          <template x-for="p in platforms" :key="p.id">
            <div class="flex items-center justify-between gap-3 py-1.5">
              <div>
                <p class="text-sm text-slate-700" x-text="p.labelCampaign"></p>
                <p class="text-xs text-slate-400" x-text="'ค่าบริการเพิ่ม ' + p.campaignPct + '%'" x-show="p.hasCampaign"></p>
              </div>
              <label class="toggle-switch" x-show="p.hasCampaign">
                <input type="checkbox" x-model="p.campaignOn" />
                <span class="slider"></span>
              </label>
              <span class="text-xs text-slate-300" x-show="!p.hasCampaign">–</span>
            </div>
          </template>
        </div>
      </section>

      <!-- ── RIGHT: COMPARISON GRID ── -->
      <section class="lg:col-span-8 space-y-4">

        <!-- Global warnings -->
        <div x-show="globalWarning" x-cloak x-transition
             class="rounded-xl bg-amber-50 border border-amber-300 text-amber-800 px-4 py-3 text-sm flex items-start gap-2">
          <i data-lucide="alert-triangle" class="w-5 h-5 shrink-0 mt-0.5"></i>
          <span x-text="globalWarning"></span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <template x-for="p in platforms" :key="p.id">
            <div :class="p.cardClass + ' platform-card'">
              <!-- Card header -->
              <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-2">
                  <span :class="p.iconBgClass + ' w-8 h-8 rounded-lg flex items-center justify-center text-white text-xs font-bold'">
                    <span x-text="p.short"></span>
                  </span>
                  <div>
                    <h3 class="font-semibold text-white" x-text="p.enabled ? p.name : p.name + ' (ปิดใช้งาน)'"></h3>
                    <label class="flex items-center gap-1.5 text-[11px] text-white/70 cursor-pointer">
                      <input type="checkbox" x-model="p.enabled" class="accent-white" /> เปิดเปรียบเทียบช่องทางนี้
                    </label>
                  </div>
                </div>
                <label class="toggle-switch" x-show="p.customizable" title="เปิดใช้งานช่องทางนี้">
                  <input type="checkbox" x-model="p.enabled" /><span class="slider"></span>
                </label>
              </div>

              <template x-if="p.enabled">
              <div>
                <!-- Custom platform name/fees -->
                <div x-show="p.customizable && p.showSetting" class="bg-black/20 rounded-xl p-3 mb-3 space-y-2">
                  <input type="text" x-model="p.name" placeholder="ชื่อช่องทาง เช่น LINE SHOPPING"
                         class="input-field-dark text-sm" />
                  <div class="grid grid-cols-3 gap-2">
                    <div>
                      <label class="text-[11px] text-white/70">คอมฯ (%)</label>
                      <input type="number" min="0" max="100" step="0.1" x-model.number="p.commissionPct" class="input-field-dark" />
                    </div>
                    <div>
                      <label class="text-[11px] text-white/70">ชำระเงิน (%)</label>
                      <input type="number" min="0" max="100" step="0.1" x-model.number="p.paymentPct" class="input-field-dark" />
                    </div>
                    <div>
                      <label class="text-[11px] text-white/70">ค่าธรรมเนียม (฿)</label>
                      <input type="number" min="0" step="0.01" x-model.number="p.fixedFee" class="input-field-dark" />
                    </div>
                  </div>
                </div>

                <!-- Headline number -->
                <div class="bg-white/10 rounded-xl p-4 mb-3">
                  <template x-if="form.calcMode==='target'">
                    <div>
                      <p class="text-xs text-white/70 mb-0.5">ราคาขายที่แนะนำ</p>
                      <p class="text-3xl font-bold text-white">
                        ฿<span x-text="fmt(result(p).price)"></span>
                      </p>
                      <p class="text-xs text-white/60 mt-1">รวมกำไรเป้าหมาย ฿<span x-text="fmt(form.targetProfit)"></span> /ชิ้น</p>
                    </div>
                  </template>
                  <template x-if="form.calcMode==='evaluate'">
                    <div>
                      <p class="text-xs text-white/70 mb-0.5">กำไรสุทธิ (ขาย ณ ราคานี้)</p>
                      <p class="text-3xl font-bold" :class="result(p).profit < 0 ? 'text-red-300' : 'text-emerald-300'">
                        ฿<span x-text="fmt(result(p).profit)"></span>
                      </p>
                      <p class="text-xs text-white/60 mt-1">อัตรากำไร <span x-text="fmt(result(p).marginPct)"></span>% ของราคาขาย</p>
                    </div>
                  </template>
                </div>

                <!-- Loss warning -->
                <div x-show="result(p).warning" x-text="result(p).warning"
                     class="text-xs bg-red-500/20 border border-red-400/40 text-red-100 rounded-lg px-3 py-2 mb-3"></div>

                <!-- Donut chart -->
                <div class="bg-white rounded-xl p-3 mb-3">
                  <canvas :id="'chart-' + p.id" height="180"></canvas>
                </div>

                <!-- Breakdown accordion -->
                <button @click="p.open = !p.open"
                        class="w-full flex items-center justify-between text-sm text-white/90 hover:text-white py-1.5">
                  <span class="flex items-center gap-1.5"><i data-lucide="receipt" class="w-4 h-4"></i> รายละเอียดการหักค่าธรรมเนียม</span>
                  <i data-lucide="chevron-down" class="w-4 h-4 transition-transform" :class="p.open && 'rotate-180'"></i>
                </button>
                <div x-show="p.open" x-collapse x-cloak class="mt-2 bg-black/20 rounded-xl p-3 text-sm space-y-1.5 text-white/90">
                  <div class="flex justify-between"><span>ค่าคอมมิชชัน (<span x-text="p.commissionPct"></span>%)</span><span>-฿<span x-text="fmt(result(p).commissionFee)"></span></span></div>
                  <div class="flex justify-between"><span>ค่าธรรมเนียมการชำระเงิน (<span x-text="p.paymentPct"></span>%)</span><span>-฿<span x-text="fmt(result(p).paymentFee)"></span></span></div>
                  <div class="flex justify-between" x-show="p.servicePct > 0"><span>ค่าบริการอื่น ๆ (<span x-text="p.servicePct"></span>%)</span><span>-฿<span x-text="fmt(result(p).serviceFee)"></span></span></div>
                  <div class="flex justify-between" x-show="p.campaignOn && p.hasCampaign"><span>ค่าแคมเปญ (<span x-text="p.campaignPct"></span>%)</span><span>-฿<span x-text="fmt(result(p).campaignFee)"></span></span></div>
                  <div class="flex justify-between" x-show="p.fixedFee > 0"><span>ค่าธรรมเนียมแพลตฟอร์ม (฿)</span><span>-฿<span x-text="fmt(p.fixedFee)"></span></span></div>
                  <div class="flex justify-between" x-show="result(p).adsFee > 0"><span>งบโฆษณา + วอลเชอร์</span><span>-฿<span x-text="fmt(result(p).adsFee)"></span></span></div>
                  <div class="flex justify-between"><span>ต้นทุนสินค้า + บรรจุภัณฑ์</span><span>-฿<span x-text="fmt(form.cost + form.packaging)"></span></span></div>
                  <div class="border-t border-white/15 my-1"></div>
                  <div class="flex justify-between font-semibold text-white"><span>กำไรสุทธิ</span><span>฿<span x-text="fmt(result(p).profit)"></span></span></div>
                  <div class="flex justify-between text-white/70"><span>ต้นทุนรวมต่อชิ้น</span><span>฿<span x-text="fmt(result(p).totalCost)"></span></span></div>
                  <button x-show="p.customizable" @click="p.showSetting = !p.showSetting"
                          class="mt-2 text-xs underline text-white/80 hover:text-white">แก้ไขค่าธรรมเนียมของช่องทางนี้</button>
                </div>
              </div>
              </template>
            </div>
          </template>
        </div>

        <!-- ── ACTION BAR ── -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-4 flex flex-wrap gap-3">
          <button @click="saveHistory()" class="btn-primary bg-indigo-600 hover:bg-indigo-700">
            <i data-lucide="save" class="w-4 h-4"></i> บันทึกประวัติ
          </button>
          <button @click="exportSingleCSV()" class="btn-primary bg-emerald-600 hover:bg-emerald-700">
            <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> ส่งออก Excel (CSV)
          </button>
          <button @click="shareCalc()" class="btn-primary bg-slate-700 hover:bg-slate-800">
            <i data-lucide="share-2" class="w-4 h-4"></i> แชร์การคำนวณ
          </button>
        </div>

        <!-- ── HISTORY ── -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5" x-show="history.length" x-cloak>
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-semibold text-slate-900 flex items-center gap-2">
              <i data-lucide="history" class="w-4 h-4 text-slate-400"></i> ประวัติการคำนวณ
            </h3>
            <button @click="clearHistory()" class="text-xs text-red-600 hover:underline">ล้างทั้งหมด</button>
          </div>
          <div class="overflow-x-auto text-sm">
            <table class="w-full text-left">
              <thead class="text-slate-500 text-xs border-b">
                <tr><th class="py-2">วันที่</th><th>สินค้า</th><th>ราคาขายแนะนำ</th><th>กำไรสุทธิ</th><th>ช่องทาง</th><th></th></tr>
              </thead>
              <tbody>
                <template x-for="(h, i) in history" :key="i">
                  <tr class="border-b last:border-0 hover:bg-slate-50">
                    <td class="py-2 text-slate-500 whitespace-nowrap" x-text="h.date"></td>
                    <td x-text="h.sku || '—'"></td>
                    <td class="font-medium">฿<span x-text="fmt(h.price)"></span></td>
                    <td :class="h.profit < 0 ? 'text-red-600' : 'text-emerald-600'">฿<span x-text="fmt(h.profit)"></span></td>
                    <td class="text-slate-500" x-text="h.platform"></td>
                    <td><button @click="history.splice(i,1)" class="text-slate-300 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td>
                  </tr>
                </template>
              </tbody>
            </table>
          </div>
        </div>
      </section>
    </div>
    </template>

    <!-- ═══════════════ BULK MODE ═══════════════ -->
    <template x-if="mode==='bulk'">
    <section class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5">
      <div class="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 class="font-semibold text-slate-900 flex items-center gap-2">
          <i data-lucide="table-2" class="w-5 h-5 text-slate-400"></i> คำนวณหลายสินค้า (SKU Management)
        </h2>
        <div class="flex gap-2">
          <button @click="addBulkRow()" class="btn-primary bg-indigo-600 hover:bg-indigo-700">
            <i data-lucide="plus" class="w-4 h-4"></i> เพิ่มสินค้า
          </button>
          <button @click="exportBulkCSV()" class="btn-primary bg-emerald-600 hover:bg-emerald-700">
            <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> ส่งออก CSV
          </button>
        </div>
      </div>

      <p class="text-xs text-slate-500 mb-3">* ใช้กำไรเป้าหมายแบบ "ตั้งกำไร → หาราคาขาย" และค่าธรรมเนียมตามหมวดหมู่ / แคมเปญที่ตั้งไว้ในหน้าสินค้าชิ้นเดียว</p>

      <div class="overflow-x-auto text-sm">
        <table class="w-full min-w-[900px] text-left">
          <thead class="text-slate-500 text-xs border-b">
            <tr>
              <th class="py-2">SKU</th>
              <th>ต้นทุน (฿)</th>
              <th>บรรจุภัณฑ์ (฿)</th>
              <th>กำไรเป้าหมาย (฿)</th>
              <template x-for="p in platforms" :key="p.id">
                <th x-show="p.enabled" class="text-center" x-text="p.short + ' ราคาขาย'"></th>
              </template>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <template x-for="(row, i) in bulkRows" :key="i">
              <tr class="border-b last:border-0 hover:bg-slate-50">
                <td class="py-1.5 pr-2"><input type="text" x-model="row.sku" placeholder="ชื่อสินค้า" class="input-field min-w-[140px]" /></td>
                <td><input type="number" min="0" step="0.01" x-model.number="row.cost" class="input-field w-24" /></td>
                <td><input type="number" min="0" step="0.01" x-model.number="row.packaging" class="input-field w-24" /></td>
                <td><input type="number" min="0" step="0.01" x-model.number="row.targetProfit" class="input-field w-24" /></td>
                <template x-for="p in platforms" :key="p.id">
                  <td x-show="p.enabled" class="text-center font-semibold"
                      :class="bulkRowResult(row, p).warning ? 'text-red-600' : 'text-slate-800'">
                    <span x-text="fmt(bulkRowResult(row, p).price)"></span>
                    <div class="text-[10px] font-normal text-slate-400" x-text="'กำไร ' + fmt(bulkRowResult(row, p).marginPct) + '%'" x-show="!bulkRowResult(row, p).warning"></div>
                  </td>
                </template>
                <td><button @click="bulkRows.splice(i,1)" class="text-slate-300 hover:text-red-500"><i data-lucide="trash-2" class="w-4 h-4"></i></button></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <div x-show="!bulkRows.length" class="text-center text-slate-400 py-10 text-sm">
        ยังไม่มีรายการสินค้า — กด "เพิ่มสินค้า" เพื่อเริ่มต้น
      </div>
    </section>
    </template>
  </main>

  <!-- Toast -->
  <div x-show="toast" x-cloak x-transition
       class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-sm px-4 py-2.5 rounded-xl shadow-lg z-50"
       x-text="toast"></div>

  <footer class="text-center text-xs text-slate-400 py-6">
    © 2026 Multi-Platform Pricing Calculator (TH) · อัตราค่าธรรมเนียมเป็นค่าอ้างอิง โปรดตรวจสอบกับแพลตฟอร์มก่อนใช้งานจริง
  </footer>

  <script src="app.js"></script>
</body>
</html>
